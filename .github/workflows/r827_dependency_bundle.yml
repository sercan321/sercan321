name: R827 Official Gradle Plugin Bundle
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch and verify exact Gradle Plugin Portal artifacts
        shell: bash
        run: |
          set -euo pipefail
          base='https://plugins.gradle.org/m2'
          out='bundle/repository'
          reports='bundle/reports'
          mkdir -p "$out" "$reports"
          paths=(
            'org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/4.3.0/org.gradle.kotlin.kotlin-dsl.gradle.plugin-4.3.0.pom'
            'org/gradle/kotlin/gradle-kotlin-dsl-plugins/4.3.0/gradle-kotlin-dsl-plugins-4.3.0.pom'
            'org/gradle/kotlin/gradle-kotlin-dsl-plugins/4.3.0/gradle-kotlin-dsl-plugins-4.3.0.module'
            'org/gradle/kotlin/gradle-kotlin-dsl-plugins/4.3.0/gradle-kotlin-dsl-plugins-4.3.0.jar'
          )
          : > "$reports/provenance.tsv"
          printf 'path\turl\tsha256\tsha1\tsize_bytes\n' >> "$reports/provenance.tsv"
          for path in "${paths[@]}"; do
            dst="$out/$path"
            mkdir -p "$(dirname "$dst")"
            url="$base/$path"
            curl --fail --location --proto '=https' --tlsv1.2 --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 "$url" -o "$dst"
            sha256=$(sha256sum "$dst" | awk '{print $1}')
            sha1=$(sha1sum "$dst" | awk '{print $1}')
            size=$(stat -c %s "$dst")
            printf '%s\t%s\t%s\t%s\t%s\n' "$path" "$url" "$sha256" "$sha1" "$size" >> "$reports/provenance.tsv"
            if curl --fail --location --silent --show-error --max-time 60 "$url.sha256" -o "$dst.sha256"; then
              expected=$(tr -d '[:space:]' < "$dst.sha256")
              test "$expected" = "$sha256"
            elif curl --fail --location --silent --show-error --max-time 60 "$url.sha1" -o "$dst.sha1"; then
              expected=$(tr -d '[:space:]' < "$dst.sha1")
              test "$expected" = "$sha1"
            else
              echo "No upstream checksum file for $url" >&2
              exit 2
            fi
          done
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('bundle/repository')
          marker = root / 'org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/4.3.0/org.gradle.kotlin.kotlin-dsl.gradle.plugin-4.3.0.pom'
          pom = ET.parse(marker).getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          dep = pom.find('.//m:dependency', ns)
          actual = tuple(dep.find(f'm:{n}', ns).text for n in ('groupId','artifactId','version'))
          expected = ('org.gradle.kotlin','gradle-kotlin-dsl-plugins','4.3.0')
          if actual != expected:
              raise SystemExit(f'marker target mismatch: {actual!r}')
          jar = root / 'org/gradle/kotlin/gradle-kotlin-dsl-plugins/4.3.0/gradle-kotlin-dsl-plugins-4.3.0.jar'
          if jar.stat().st_size < 40000:
              raise SystemExit('implementation jar unexpectedly small')
          PY
          (cd bundle && zip -qr ../r827_gradle_plugin_portal_4.3.0.zip repository reports)
          sha256sum r827_gradle_plugin_portal_4.3.0.zip | tee "$reports/bundle.sha256"
      - name: Upload exact repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: r827-gradle-plugin-portal-4.3.0
          path: |
            r827_gradle_plugin_portal_4.3.0.zip
            bundle/reports/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

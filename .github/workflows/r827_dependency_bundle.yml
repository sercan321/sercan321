name: R827 Official Pub Archive Bundle
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch and verify exact pub.dev archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/archives bundle/reports
          python3 - <<'PY'
          import base64, csv, hashlib, io, json, pathlib, tarfile, urllib.parse, urllib.request
          payload = base64.b64decode('').decode()
          packages = list(csv.reader(io.StringIO(payload), delimiter='\t'))
          if len(packages) != 38:
              raise SystemExit(f'expected 38 packages, got {len(packages)}')
          root = pathlib.Path('bundle')
          rows = []
          for name, version in packages:
              qn = urllib.parse.quote(name, safe='')
              qv = urllib.parse.quote(version, safe='')
              metadata_url = f'https://pub.dev/api/packages/{qn}/versions/{qv}'
              request = urllib.request.Request(metadata_url, headers={'User-Agent': 'MathPro-R827-audit/2.0'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  metadata = json.load(response)
              archive_url = metadata['archive_url']
              expected = metadata['archive_sha256'].lower()
              destination = root / 'archives' / f'{name}-{version}.tar.gz'
              digest = hashlib.sha256()
              size = 0
              request = urllib.request.Request(archive_url, headers={'User-Agent': 'MathPro-R827-audit/2.0'})
              with urllib.request.urlopen(request, timeout=240) as response, destination.open('wb') as output:
                  while True:
                      block = response.read(1048576)
                      if not block:
                          break
                      output.write(block)
                      digest.update(block)
                      size += len(block)
              actual = digest.hexdigest()
              if actual != expected:
                  raise SystemExit(f'{name} {version} SHA mismatch: {actual} != {expected}')
              with tarfile.open(destination, 'r:gz') as archive:
                  members = archive.getmembers()
                  if not members:
                      raise SystemExit(f'{name} {version}: empty archive')
                  for member in members:
                      path = pathlib.PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts:
                          raise SystemExit(f'{name} {version}: unsafe path {member.name!r}')
                  pubspec_members = [m for m in members if pathlib.PurePosixPath(m.name).as_posix() == 'pubspec.yaml']
                  if len(pubspec_members) != 1:
                      raise SystemExit(f'{name} {version}: expected one root pubspec.yaml, got {len(pubspec_members)}')
                  pubspec_text = archive.extractfile(pubspec_members[0]).read().decode('utf-8')
                  found_name = None
                  found_version = None
                  for line in pubspec_text.splitlines():
                      if line.startswith('name:') and found_name is None:
                          found_name = line.split(':', 1)[1].strip().strip('"\'')
                      if line.startswith('version:') and found_version is None:
                          found_version = line.split(':', 1)[1].strip().strip('"\'')
                  if found_name != name or found_version != version:
                      raise SystemExit(f'{name} {version}: pubspec identity {found_name}@{found_version}')
              rows.append((name, version, expected, actual, size, archive_url, metadata_url))
              print('PASS', name, version, actual, size)
          report = root / 'reports' / 'provenance.tsv'
          with report.open('w', newline='') as output:
              writer = csv.writer(output, delimiter='\t', lineterminator='\n')
              writer.writerow(('name', 'version', 'api_sha256', 'actual_sha256', 'size_bytes', 'archive_url', 'metadata_url'))
              writer.writerows(rows)
          (root / 'reports' / 'summary.json').write_text(json.dumps({'expected': 38, 'verified': len(rows), 'failures': []}, indent=2, sort_keys=True) + '\n')
          PY
          tar -C bundle -czf r827_official_pub_archives_38.tar.gz archives reports
          sha256sum r827_official_pub_archives_38.tar.gz | tee bundle/reports/bundle.sha256
      - name: Upload verified archive bundle
        uses: actions/upload-artifact@v4
        with:
          name: r827-official-pub-archives-38
          path: |
            r827_official_pub_archives_38.tar.gz
            bundle/reports/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

name: R827 Official Pub Dependency Bundle
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch and verify official archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/archives bundle/reports
          python3 - <<'PY'
          import base64, csv, hashlib, io, json, pathlib, urllib.parse, urllib.request
          payload = base64.b64decode('').decode()
          root = pathlib.Path('bundle')
          (root / 'reports' / 'packages.tsv').write_text(payload)
          out = []
          failures = []
          for name, version in csv.reader(io.StringIO(payload), delimiter='\t'):
              try:
                  qn = urllib.parse.quote(name, safe='')
                  qv = urllib.parse.quote(version, safe='')
                  meta_url = f'https://pub.dev/api/packages/{qn}/versions/{qv}'
                  req = urllib.request.Request(meta_url, headers={'User-Agent': 'MathPro-R827-audit/1.0'})
                  with urllib.request.urlopen(req, timeout=60) as response:
                      meta = json.load(response)
                  url = meta['archive_url']
                  expected = meta['archive_sha256'].lower()
                  destination = root / 'archives' / f'{name}-{version}.tar.gz'
                  digest = hashlib.sha256()
                  size = 0
                  req = urllib.request.Request(url, headers={'User-Agent': 'MathPro-R827-audit/1.0'})
                  with urllib.request.urlopen(req, timeout=180) as response, destination.open('wb') as output:
                      while True:
                          block = response.read(1048576)
                          if not block:
                              break
                          output.write(block)
                          digest.update(block)
                          size += len(block)
                  actual = digest.hexdigest()
                  if actual != expected:
                      raise RuntimeError(f'SHA mismatch actual={actual} api={expected}')
                  out.append((name, version, expected, actual, size, url, meta_url))
                  print('PASS', name, version, actual, size)
              except Exception as exc:
                  failures.append((name, version, str(exc)))
                  print('FAIL', name, version, exc)
          with (root / 'reports' / 'verified.tsv').open('w', newline='') as output:
              writer = csv.writer(output, delimiter='\t', lineterminator='\n')
              writer.writerow(('name', 'version', 'api_sha256', 'actual_sha256', 'size_bytes', 'archive_url', 'metadata_url'))
              writer.writerows(out)
          summary = {'expected': 74, 'verified': len(out), 'failures': failures}
          (root / 'reports' / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          if len(out) != 74 or failures:
              raise SystemExit(summary)
          PY
          tar -C bundle -czf r827_official_pub_dependency_bundle.tar.gz archives reports
          sha256sum r827_official_pub_dependency_bundle.tar.gz | tee bundle/reports/bundle_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r827-official-pub-dependency-bundle
          path: |
            r827_official_pub_dependency_bundle.tar.gz
            bundle/reports/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
